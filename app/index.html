<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Student Finance Tracker</title>
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
        <nav>
            <button id="themeBtn" type="button" aria-pressed="false">Dark mode</button>
        </nav>
        <h1 id="appName"></h1>
        <nav aria-label="Main">
            <a href="#about">About</a>
            <a href="#dashboard">Dashboard</a>
            <a href="#records">Records</a>
            <a href="#form">Add Expense</a>
            <a href="#settings">Settings</a>
        </nav>
    </header>

    <main id="main" tabindex="-1">

        <section id="about">
            <h2>This will be a Student Finance Tracker</h2>
            <p id="aboutText"></p>
            <p>GitHub: <a href="https://github.com/aubin-karaha">aubin-karaha</a><br>Email: <a
                    href="mailto:c.karaha@alustudent.com">c.karaha@alustudent.com</a></p>
        </section>

        <section id="dashboard">
            <h2>Dashboard</h2>
            <dl class="stats">
                <div>
                    <dt>Total records</dt>
                    <dd id="sTotal"></dd>
                </div>
                <div>
                    <dt id="sumLabel"></dt>
                    <dd id="sSum"></dd>
                </div>
                <div>
                    <dt>Top tag</dt>
                    <dd id="sTop"></dd>
                </div>
            </dl>
            <h3>Last 7 days</h3>
            <div id="chart" class="chart" role="img" aria-label="Last 7 days chart"></div>
            <p id="capPolite" role="status" aria-live="polite"></p>
            <p id="capAssertive" class="over" role="alert" aria-live="assertive"></p>
        </section>

        <section id="records">
            <h2>Records</h2>
            <div class="tools">
                <label>Regex search <input id="search" placeholder="e.g. (Transport, Lunch)"></label>
                <label class="inline"><input type="checkbox" id="ci" checked> Ignore case</label>
                <label>Sort <select id="sort">
                        <option value="date-d">Date: newest</option>
                        <option value="date-a">Date: oldest</option>
                        <option value="title-a">Title A→Z</option>
                        <option value="title-z">Title Z→A</option>
                        <option value="val-a">Number ↑</option>
                        <option value="val-d">Number ↓</option>
                    </select></label>
            </div>

            <p id="searchStatus" role="status"></p>

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th id="thTitle"></th>
                        <th id="thVal"></th>
                        <th id="thTag"></th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </section>

        <section id="form">
            <h2 id="formTitle">Add record</h2>
            <form id="recForm" novalidate>
                <label><span id="lTitle"></span><input id="fTitle" aria-describedby="eTitle"></label><span class="err"
                    id="eTitle"></span>
                <label><span id="lVal"></span><input id="fVal" inputmode="decimal" aria-describedby="eVal"></label><span
                    class="err" id="eVal"></span>
                <label><span id="lTag"></span><input id="fTag" list="tags" aria-describedby="eTag"></label><datalist
                    id="tags"></datalist><span class="err" id="eTag"></span>
                <label>Date (YYYY-MM-DD)<input id="fDate" placeholder="2025-09-29"
                        aria-describedby="eDate"></label><span class="err" id="eDate"></span>
                <input type="hidden" id="fId">
                <button>Save</button> <button type="button" id="cancel">Cancel</button>

                <p id="formStatus" role="status"></p>
            </form>
        </section>

        <section id="settings">
            <h2>Settings</h2>
            <label>Cap (0 = off) <input id="cap" type="number" min="0" step="any"></label>
            <label>Show numbers in <select id="unit"></select></label>
            <fieldset>
                <legend>Rates (1 base = ? of each)</legend>
                <div id="rates"></div>
            </fieldset>

            <fieldset>
                <legend id="catLegend">Categories</legend>
                <ul id="catList"></ul>
                <label>New category <input id="newCat" aria-describedby="eCat"></label>
                <span class="err" id="eCat" role="alert"></span>
                <button type="button" id="addCat">Add</button>
            </fieldset>

            <button id="export">Export JSON</button>
            <label>Import JSON <input type="file" id="import" accept=".json"></label>
            <button id="reset">Reset to raw data</button>
            <p id="setStatus" role="status"></p>
        </section>

    </main>
    <script type="module" src="scripts/main.js"></script>
</body>

</html>
